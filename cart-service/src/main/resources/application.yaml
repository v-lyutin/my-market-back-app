spring:
  application:
    name: my-market
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/my-market}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  liquibase:
    enabled: true
    change-log: classpath:db.changelog/db.changelog-master.yaml
    liquibase-schema: public
    default-schema: public
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/my-market}
    user: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  security:
    oauth2:
      client:
        registration:
          payment-service:
            provider: keycloak
            client-id: my-market-service
            client-secret: ${CLIENT_SECRET:JTlSvYPIGnpxwS6AaSgU2i5zLBrnEeQx}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${ISSUER_URI:http://localhost:18080/realms/my-market}
server:
  port: ${CART_SERVICE_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
storage:
  minio:
    base-url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minio}
    secret-key: ${MINIO_SECRET_KEY:minio123}
    bucket: ${MINIO_BUCKET_NAME:images}
    secure: false
    create-bucket-if-missing: true
    connect-timeout-ms: ${MINIO_CONNECT_TIMEOUT_MS:5000}
    write-timeout-ms: ${MINIO_WRITE_TIMEOUT_MS:60000}
    read-timeout-ms: ${MINIO_READ_TIMEOUT_MS:60000}
    max-file-size-bytes: ${MINIO_MAX_FILE_SIZE_BYTES:10485760}
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
payment-service-client:
  base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8081}

