<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container p-4" style="max-width: 520px;">
    <div class="text-center mb-3">
        <h2><span class="badge text-bg-success">Витрина магазина</span></h2>
    </div>

    <div th:if="${showError}" class="alert alert-danger">
        Неверный логин или пароль
    </div>

    <div th:if="${showLogout}" class="alert alert-info">
        Вы вышли из системы
    </div>

    <div th:if="${showRegistered}" class="alert alert-success">
        Регистрация прошла успешно. Теперь вы можете войти.
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Вход</h4>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Логин</label>
                    <input name="username" class="form-control" autocomplete="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Пароль</label>
                    <input name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>

                <div class="hstack gap-3">
                    <button type="submit" class="btn btn-success bi bi-box-arrow-in-right"> Войти</button>
                    <a th:href="@{/register}" class="btn btn-outline-secondary ms-auto">Регистрация</a>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/items}" class="text-muted">← На витрину</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
